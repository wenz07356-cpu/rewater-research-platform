# 可选的本地基础设施叠加文件。
# 与主编排一起使用：
# docker compose -f compose.yaml -f compose.local-infra.yaml up -d --build

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: local-dev-only
    volumes:
      - local-mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - admin
        - --password
        - local-dev-only
        - --authenticationDatabase
        - admin
        - --eval
        - db.adminCommand('ping')
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - local-dev-only
      - --appendonly
      - "yes"
    volumes:
      - local-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "local-dev-only", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - local-etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    volumes:
      - local-minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  milvus:
    image: milvusdb/milvus:v2.6.22
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - local-milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 30s

  knowledge-import:
    environment:
      MILVUS_URL: http://milvus:19530
      MONGO_URL: mongodb://admin:local-dev-only@mongo:27017/?authSource=admin
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "False"
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy

  knowledge-query:
    environment:
      MILVUS_URL: http://milvus:19530
      MONGO_URL: mongodb://admin:local-dev-only@mongo:27017/?authSource=admin
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "False"
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy

  research-api:
    environment:
      MONGODB_URI: mongodb://admin:local-dev-only@mongo:27017/?authSource=admin
      REDIS_URL: redis://:local-dev-only@redis:6379/0
      CELERY_BROKER_URL: redis://:local-dev-only@redis:6379/0
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  research-worker:
    environment:
      MONGODB_URI: mongodb://admin:local-dev-only@mongo:27017/?authSource=admin
      REDIS_URL: redis://:local-dev-only@redis:6379/0
      CELERY_BROKER_URL: redis://:local-dev-only@redis:6379/0
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      knowledge-query:
        condition: service_healthy

volumes:
  local-mongo-data:
  local-redis-data:
  local-etcd-data:
  local-minio-data:
  local-milvus-data:
