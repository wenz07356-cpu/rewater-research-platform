events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 100m;

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"ok":true,"module":"gateway"}';
        }

        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location = /knowledge/import {
            proxy_pass http://knowledge-import:8000/html;
        }

        location = /knowledge/chat {
            proxy_pass http://knowledge-query:8001/html;
        }

        location = /research {
            proxy_pass http://research-api:8010/;
        }

        location = /knowledge/import/ {
            return 308 /knowledge/import;
        }

        location = /knowledge/chat/ {
            return 308 /knowledge/chat;
        }

        location = /research/ {
            return 308 /research;
        }

        location /query-assets/ {
            proxy_pass http://knowledge-query:8001/query-assets/;
        }

        location /api/knowledge/import/ {
            rewrite ^/api/knowledge/import/(.*)$ /$1 break;
            proxy_pass http://knowledge-import:8000;
        }

        location /api/knowledge/query/ {
            rewrite ^/api/knowledge/query/(.*)$ /$1 break;
            proxy_pass http://knowledge-query:8001;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            add_header X-Accel-Buffering no;
        }

        location /api/research/v1/ {
            rewrite ^/api/research/v1/(.*)$ /api/v1/$1 break;
            proxy_pass http://research-api:8010;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }
    }
}
